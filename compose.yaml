name: lottery-next
services:
  db:
    image: public.ecr.aws/docker/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lottery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure .env first}
      POSTGRES_DB: lottery
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U lottery -d lottery']
      interval: 10s
      timeout: 5s
      retries: 10
    # 数据库不暴露宿主机端口。
  migrate:
    build:
      context: .
      target: tooling
    command: [pnpm, db:deploy]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    profiles: [tools]
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    # 应用只通过 HTTPS 反向代理访问。
  proxy:
    image: public.ecr.aws/docker/library/caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?configure HTTPS site address}
      LAN_BIND_IP: ${LAN_BIND_IP:-127.0.0.1}
    ports:
      - '${LAN_BIND_IP:-127.0.0.1}:8443:8443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
